# Local, single-host deployment.
#   docker compose up --build                                  -> UI on http://localhost:8080
#   docker compose exec backend python -m app.cli demo         -> load the demo data (synthetic)
services:
  backend:
    build: ./backend
    environment:
      CD_DATA_DIR: /data
      # Demo tokens. Replace them (or wire up SSO) before exposing the service anywhere.
      CD_AUTH_TOKENS: ${CD_AUTH_TOKENS:-board-token:bea:board_member,manager-token:max:property_manager,admin-token:adam:admin}
      CD_LOG_JSON: "true"
      # For Postgres instead of SQLite, uncomment the db service and set:
      # CD_DATABASE_URL: postgresql+psycopg://capital_drift:capital_drift@db:5432/capital_drift
    volumes:
      - app-data:/data

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  # db:
  #   image: postgres:17-alpine
  #   environment: { POSTGRES_USER: capital_drift, POSTGRES_PASSWORD: capital_drift, POSTGRES_DB: capital_drift }
  #   volumes: [ "pg-data:/var/lib/postgresql/data" ]

volumes:
  app-data:
  # pg-data:
