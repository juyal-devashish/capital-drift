[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capital-drift-backend"
version = "0.1.0"
description = "Capital Drift Monitor: checks an HOA's spending against its reserve study (API, CLI and evaluation)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pdfplumber>=0.11",
    "reportlab>=4.0",  # writes the synthetic reserve-study PDFs (`demo`, `synth`)
]

[project.optional-dependencies]
# Claude invoice matching (offline, from the CLI). anthropic[bedrock] adds the Amazon Bedrock client.
llm = ["anthropic[bedrock]>=2.9"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008: FastAPI's Depends()/Query()/File() in defaults is the framework's documented idiom.
ignore = ["B008"]
